<div class="custom-modal" *ngIf="isOpen">
  <div class="custom-modal-card">
    <div class="custom-modal-header">
      <div class="custom-modal-title-area">
        <div class="custom-modal-icon" [ngClass]="variant">
          <i class="bi" [class.bi-exclamation-triangle]="variant === 'danger'"
             [class.bi-check-circle]="variant === 'success'" [class.bi-question-circle]="variant === 'primary'"
             [class.bi-exclamation-circle]="variant === 'warning'">
          </i>
        </div>

        <div>
          <h5 class="custom-modal-title">
            {{ title }}
          </h5>

          <p class="custom-modal-subtitle">
            Confirme a ação para continuar
          </p>
        </div>
      </div>

      <button type="button" class="custom-close-btn" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="custom-modal-body">
      <p class="custom-modal-message">
        {{ message }}
      </p>
    </div>

    <div class="custom-modal-footer">
      <button type="button" class="btn secondary-btn" (click)="onClose()">
        {{ cancelText }}
      </button>

      <button type="button" class="btn modal-confirm-btn" [ngClass]="variant" (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
