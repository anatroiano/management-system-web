<header class="navbar d-flex justify-content-between align-items-center px-4 py-2 shadow-sm bg-white">

  <div class="left-side d-flex align-items-center gap-3">

    <button class="btn btn-icon" (click)="onToggleSidebar()">
      <i [class]="'bi bi-' + icon"></i>
    </button>

    <h1 class="h4 m-0">
      {{title}}
    </h1>

  </div>

  <div class="right-side d-flex align-items-center gap-3">

    <div class="input-group search-field" *ngIf="showFilter">

      <span class="input-group-text bg-white">
        <i class="bi bi-search"></i>
      </span>

      <input type="text" class="form-control" placeholder="Buscar..." />

    </div>
  </div>

</header>
