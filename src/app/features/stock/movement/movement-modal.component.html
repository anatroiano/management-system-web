<div class="custom-modal" *ngIf="isOpen">
  <div class="custom-modal-card">
    <div class="custom-modal-header">
      <div class="custom-modal-title-area">
        <div class="custom-modal-icon">
          <i class="bi" class="bi-exclamation-triangle"></i>
        </div>

        <div>
          <h5 class="custom-modal-title">
            {{
            movementType === 'ENTRY'
            ? 'Nova Entrada'
            : 'Nova Saída'
            }}
          </h5>

          <p class="custom-modal-subtitle">
            Preencha o formulário para continuar
          </p>
        </div>
      </div>

      <button type="button" class="custom-close-btn" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="custom-modal-body">
      <form [formGroup]="form">

        <div *ngIf="stock" class="alert alert-light border">

          <strong>
            {{ stock.productName }}
          </strong>

          <div class="small text-muted">
            Estoque atual:
            {{ stock.quantity }}
          </div>

        </div>

        <div class="mb-3">
          <label class="form-label required">
            Quantidade
          </label>

          <input type="number" class="form-control" [class.is-invalid]="isInvalidAndTouched('quantity')"
            formControlName="quantity">

          <div class="text-danger small mt-1" *ngIf="isInvalidAndTouched('quantity')">
            Informe uma quantidade válida
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Motivo
          </label>

          <textarea rows="3" class="form-control" formControlName="reason"></textarea>

        </div>
      </form>
    </div>

    <div class="custom-modal-footer">
      <button type="button" class="btn secondary-btn" (click)="onClose()">
        Cancelar
      </button>

      <button type="button" class="btn modal-confirm-btn success" (click)="onConfirm()">
        Confirmar
      </button>
    </div>
  </div>
</div>
