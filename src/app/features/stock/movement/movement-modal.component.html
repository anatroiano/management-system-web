<div class="custom-modal" *ngIf="isOpen">
  <div class="custom-modal-card">

    <div class="custom-modal-header">
      <div class="custom-modal-title-area">
        <div class="custom-modal-icon">
          <i class="bi bi-arrow-left-right"></i>
        </div>
        <div>
          <h5 class="custom-modal-title">{{ resolvedTitle }}</h5>
          <p class="custom-modal-subtitle">Preencha o formulário para continuar</p>
        </div>
      </div>
      <button type="button" class="custom-close-btn" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="custom-modal-body">
      <form [formGroup]="form">

        <ng-container *ngIf="isFreeMode">

          <div class="mb-3">
            <label class="form-label required">Produto</label>

            <ng-select formControlName="productId" [items]="products" bindValue="id" bindLabel="name"
              placeholder="Selecione um produto" [loading]="loadingProducts"
              [class.is-invalid]="isInvalidAndTouched('productId')" (scrollToEnd)="loadProducts()">

              <ng-template ng-option-tmp let-item="item">
                {{ item.code }} - {{ item.name }}
              </ng-template>

            </ng-select>

            <div class="text-danger small mt-1" *ngIf="isInvalidAndTouched('productId')">
              Selecione um produto
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label required">Tipo de movimento</label>

            <select class="form-select" formControlName="movementType"
              [class.is-invalid]="isInvalidAndTouched('movementType')">
              <option [ngValue]="null" disabled>Selecione o tipo</option>
              <option [ngValue]="MovementType.ENTRY">Entrada</option>
              <option [ngValue]="MovementType.MANUAL_EXIT">Saída manual</option>
            </select>

            <div class="text-danger small mt-1" *ngIf="isInvalidAndTouched('movementType')">
              Selecione o tipo de movimento
            </div>
          </div>

        </ng-container>

        <div *ngIf="stock" class="alert alert-light border mb-3">
          <strong>{{ stock.productName }}</strong>
          <div class="small text-muted">Estoque atual: {{ stock.quantity }}</div>
        </div>

        <div class="mb-3">
          <label class="form-label required">Quantidade</label>
          <input type="number" class="form-control" formControlName="quantity"
            [class.is-invalid]="isInvalidAndTouched('quantity')">
          <div class="text-danger small mt-1" *ngIf="isInvalidAndTouched('quantity')">
            Informe uma quantidade válida
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Motivo</label>
          <textarea rows="3" class="form-control" formControlName="reason"></textarea>
        </div>

      </form>
    </div>

    <div class="custom-modal-footer">
      <button type="button" class="btn secondary-btn" (click)="onClose()">Cancelar</button>
      <button type="button" class="btn modal-confirm-btn success" (click)="onConfirm()"
        [disabled]="form.invalid">Confirmar</button>
    </div>

  </div>
</div>
