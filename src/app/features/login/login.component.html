<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand text-center">
        <div class="brand-icon">
          <i class="bi bi-grid-1x2-fill"></i>
        </div>

        <h1 class="brand-name">GestãoPro</h1>
        <p class="brand-subtitle">
          Bem-vindo de volta. Entre na sua conta.
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <div class="input-group login-input">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>

            <input type="email" class="form-control" placeholder="Digite seu e-mail" formControlName="email">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0">Senha</label>
          </div>

          <div class="input-group login-input">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Digite sua senha"
                   formControlName="password">

            <button type="button" class="btn btn-outline-secondary password-btn" (click)="togglePassword()">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger py-2 small">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn login-btn w-100" [disabled]="loading">
          {{ loading ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</div>
