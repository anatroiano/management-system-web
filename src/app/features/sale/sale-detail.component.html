<div class="container-fluid py-4" *ngIf="sale">

  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h3 class="fw-bold mb-1">
          Venda #{{ sale.id }}
        </h3>

        <span class="text-secondary">
          {{ sale.createdAt | date:'dd/MM/yyyy HH:mm' }}
        </span>
      </div>

      <div class="text-end">
        <p class="text-secondary mb-1">Total</p>

        <h3 class="fw-bold">
          {{ sale.totalAmount | currency:'BRL' }}
        </h3>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body">

      <h5 class="fw-bold mb-4">
        Itens da venda
      </h5>

      <div class="table-responsive">
        <table class="table align-middle">

          <thead>
          <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Valor unitário</th>
            <th>Subtotal</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let item of sale.items">
            <td>#{{ item.productId }}</td>

            <td>{{ item.quantity }}</td>

            <td>
              {{ item.unitPrice | currency:'BRL' }}
            </td>

            <td class="fw-semibold">
              {{ item.subtotal | currency:'BRL' }}
            </td>
          </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

</div>
