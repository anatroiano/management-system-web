<div class="details-page">
    <div class="details-card">

        <div class="details-header">
            <div class="details-title-area">
                <div>
                    <h2 class="details-title">
                        Nova venda
                    </h2>

                    <p class="details-subtitle">
                        Selecione os itens da venda
                    </p>
                </div>
            </div>

            <div class="details-actions">
                <button type="button" class="btn secondary-btn" (click)="goToList()">
                    <i class="bi bi-arrow-left"></i>
                    Voltar
                </button>
            </div>
        </div>

        <div class="details-content">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label class="custom-label required">
                        Cliente
                    </label>

                    <select class="form-select custom-input" [(ngModel)]="selectedCustomer"
                        (scroll)="onCustomerScroll($event)">
                        <option *ngFor="let customer of customers" [ngValue]="customer">
                            {{ customer.name }}
                        </option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <div>
                    <h5 class="details-title" style="font-size: 1.2rem;">
                        Itens da venda
                    </h5>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="custom-label required">
                            Produto
                        </label>

                        <select class="form-select custom-input" [(ngModel)]="selectedProduct"
                            (ngModelChange)="onProductChange()" (scroll)="onProductScroll($event)">
                            <option *ngFor="let product of products" [ngValue]="product">
                                {{ product.name }}
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="custom-label required">
                            Quantidade
                        </label>

                        <input type="number" class="form-control custom-input" [(ngModel)]="quantity">
                    </div>

                    <div class="form-group">
                        <label class="custom-label required">
                            Preço unitário
                        </label>

                        <input type="number" class="form-control custom-input" [(ngModel)]="unitPrice">
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-3 mb-4">
                    <button type="button" class="btn primary-btn" (click)="addItem()">
                        <i class="bi bi-plus-lg"></i>
                        Adicionar item
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Qtd</th>
                                <th>Valor unitário</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let item of items; let i = index">
                                <td>
                                    {{ item.productName }}
                                </td>

                                <td>
                                    {{ item.quantity }}
                                </td>

                                <td>
                                    {{ item.unitPrice | currency:'BRL' }}
                                </td>

                                <td class="fw-semibold">
                                    {{ item.subtotal | currency:'BRL' }}
                                </td>

                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeItem(i)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <div class="text-end">
                        <span class="text-secondary d-block">
                            Total da venda
                        </span>

                        <h3 class="fw-bold mb-0">
                            {{ total | currency:'BRL' }}
                        </h3>
                    </div>
                </div>
            </div>

            <div class="form-actions">

                <button type="button" class="btn secondary-btn" (click)="goToList()">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </button>

                <button type="button" class="btn primary-btn" (click)="save()">
                    <i class="bi bi-check-lg"></i>
                    Registrar venda
                </button>
            </div>
        </div>
    </div>
</div>
