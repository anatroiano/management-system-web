<div class="container-fluid py-3">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <div class="mb-3">
                <h3 class="fw-bold mb-0">
                    Nova venda
                </h3>

                <span class="text-secondary">
                    Selecione os itens da venda.
                </span>
            </div>

            <div class="row g-2 mb-3">

                <div class="col-md-6">
                    <label class="form-label mb-1">
                        Cliente
                    </label>

                    <select
                        class="form-select"
                        [(ngModel)]="selectedCustomer"
                        (scroll)="onCustomerScroll($event)"
                        style="max-height: 200px"
                    >
                        <option
                            *ngFor="let customer of customers"
                            [ngValue]="customer"
                        >
                            {{ customer.name }}
                        </option>
                    </select>
                </div>

            </div>

            <div class="border rounded-4 p-3">

                <div class="row g-2 align-items-end mb-3">

                    <div class="col-md-6">
                        <label class="form-label mb-1">
                            Produto
                        </label>

                        <select
                            class="form-select"
                            [(ngModel)]="selectedProduct"
                            (ngModelChange)="onProductChange()"
                            (scroll)="onProductScroll($event)"
                            style="max-height: 200px"
                        >
                            <option
                                *ngFor="let product of products"
                                [ngValue]="product"
                            >
                                {{ product.name }}
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label mb-1">
                            Qtd
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            [(ngModel)]="quantity"
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="form-label mb-1">
                            Preço
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            [(ngModel)]="unitPrice"
                        >
                    </div>

                </div>

                <div class="d-flex justify-content-end mb-3">
                    <button
                        class="btn btn-dark px-4"
                        (click)="addItem()"
                    >
                        Adicionar
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table align-middle mb-0">

                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Qtd</th>
                                <th>Valor unitário</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let item of items; let i = index">

                                <td>
                                    {{ item.productName }}
                                </td>

                                <td>
                                    {{ item.quantity }}
                                </td>

                                <td>
                                    {{ item.unitPrice | currency:'BRL' }}
                                </td>

                                <td class="fw-semibold">
                                    {{ item.subtotal | currency:'BRL' }}
                                </td>

                                <td class="text-end">

                                    <button
                                        class="btn btn-sm btn-outline-danger"
                                        (click)="removeItem(i)"
                                    >
                                        Remover
                                    </button>

                                </td>

                            </tr>
                        </tbody>

                    </table>
                </div>

                <div class="d-flex justify-content-end mt-3">
                    <div class="text-end">
                        <p class="text-secondary mb-0">
                            Total
                        </p>

                        <h4 class="fw-bold mb-0">
                            {{ total | currency:'BRL' }}
                        </h4>
                    </div>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">

                <button
                    class="btn btn-outline-secondary px-4"
                    routerLink="/sales"
                >
                    Cancelar
                </button>

                <button
                    class="btn btn-dark px-4"
                    (click)="save()"
                >
                    Registrar venda
                </button>

            </div>

        </div>
    </div>
</div>
