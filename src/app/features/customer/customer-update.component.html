<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-0 fw-semibold">
                {{ isEditMode
                ? 'Editar cliente'
                : 'Novo cliente' }}
            </h4>

            <small class="text-muted">
                {{ isEditMode
                ? 'Atualize as informações do cliente'
                : 'Preencha os dados do cliente' }}
            </small>
        </div>

        <button class="btn btn-outline-secondary" (click)="goToList()">
            <i class="bi bi-arrow-left me-2"></i>
            Voltar
        </button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="row">
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input type="text" class="form-control" formControlName="name"
                            [class.is-invalid]="form.get('name')?.touched && form.get('name')?.invalid">

                        <div class="invalid-feedback">
                            <span *ngIf="form.get('name')?.errors?.['required']">
                                Nome obrigatório
                            </span>

                            <span *ngIf="form.get('name')?.errors?.['maxlength']">
                                Nome deve ter no máximo 100 caracteres
                            </span>
                        </div>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            E-mail
                        </label>

                        <input type="text" class="form-control" formControlName="email"
                            [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">

                        <div class="invalid-feedback">
                            <span *ngIf="form.get('email')?.errors?.['required']">
                                E-mail obrigatório
                            </span>

                            <span *ngIf="form.get('email')?.errors?.['email']">
                                E-mail inválido
                            </span>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Telefone
                        </label>

                        <input type="text" class="form-control" formControlName="phone" mask="(00) 00000-0000"
                            [dropSpecialCharacters]="true"
                            [class.is-invalid]="form.get('phone')?.touched && form.get('phone')?.invalid">

                        <div class="invalid-feedback">
                            <span *ngIf="form.get('phone')?.errors">
                                Telefone inválido
                            </span>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Documento
                        </label>

                        <input type="text" class="form-control" formControlName="document"
                            mask="000.000.000-00||00.000.000/0000-00"
                            [class.is-invalid]="form.get('document')?.touched && form.get('document')?.invalid">

                        <div class="invalid-feedback">
                            <span *ngIf="form.get('document')?.errors?.['invalidDocument']">
                                CPF ou CNPJ inválido
                            </span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-outline-secondary" (click)="goToList()">
                        <i class="bi bi-x-lg me-2"></i>
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">
                        <i class="bi bi-check-lg me-2"></i>
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
