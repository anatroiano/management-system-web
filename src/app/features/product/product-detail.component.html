<div class="container-fluid" *ngIf="product">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h4 class="mb-0 fw-semibold">
        {{ product.name }}
      </h4>

      <small class="text-muted">
        Código: {{ product.code }}
      </small>
    </div>

    <div class="d-flex gap-2">

      <button class="btn btn-outline-secondary" (click)="goToList()">

        <i class="bi bi-arrow-left me-2"></i>
        Voltar
      </button>

      <button class="btn btn-primary" (click)="goToEdit()">

        <i class="bi bi-pencil-square me-2"></i>
        Editar
      </button>

    </div>

  </div>

  <div class="card shadow-sm border-0 product-details">
    <div class="card-body">

      <div class="row g-4">

        <div class="col-md-6">
          <label class="label">
            ID
          </label>

          <div class="value">
            {{ product.id }}
          </div>
        </div>

        <div class="col-md-6">
          <label class="label">
            Preço
          </label>

          <div class="value price">
            {{ CurrencyUtil.formatBRL(product.price) }}
          </div>
        </div>

        <div class="col-md-12">
          <label class="label">
            Descrição
          </label>

          <div class="value">
            {{ product.description }}
          </div>
        </div>

        <div class="col-md-6">
          <label class="label">
            Data de criação
          </label>

          <div class="value">
            {{ product.createdAt | date:'dd/MM/yyyy HH:mm' }}
          </div>
        </div>

      </div>

    </div>

  </div>

</div>
