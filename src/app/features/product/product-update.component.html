<div class="details-page">
  <div class="details-card">
    <div class="details-header">
      <div class="details-title-area">
        <div>
          <h2 class="details-title">
            {{ isEditMode
            ? 'Editar produto'
            : 'Novo produto' }}
          </h2>

          <p class="details-subtitle">
            {{ isEditMode
            ? 'Atualize as informações do produto'
            : 'Preencha os dados do produto' }}
          </p>
        </div>
      </div>

      <div class="details-actions">
        <button type="button" class="btn secondary-btn" (click)="goToList()">

          <i class="bi bi-arrow-left"></i>
          Voltar
        </button>
      </div>
    </div>

    <div class="details-content">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          <div class="form-group">
            <label class="custom-label">
              Código
            </label>

            <input type="text" class="form-control custom-input" formControlName="code">

            <div class="custom-error" *ngIf="form.get('code')?.touched && form.get('code')?.invalid">
              Campo obrigatório
            </div>
          </div>

          <div class="form-group">
            <label class="custom-label">
              Nome
            </label>

            <input type="text" class="form-control custom-input" formControlName="name">

            <div class="custom-error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
              Campo obrigatório
            </div>
          </div>

          <div class="form-group">
            <label class="custom-label">
              Preço
            </label>

            <input type="text" class="form-control custom-input" formControlName="price" mask="separator.2"
              thousandSeparator="." decimalMarker=",">

            <div class="custom-error" *ngIf="form.get('price')?.touched && form.get('price')?.invalid">
              Campo obrigatório
            </div>
          </div>

          <div class="form-group full-width">
            <label class="custom-label">
              Descrição
            </label>

            <textarea rows="4" class="form-control custom-input custom-textarea" formControlName="description">
            </textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn secondary-btn" (click)="goToList()">
            <i class="bi bi-x-lg"></i>
            Cancelar
          </button>

          <button type="submit" class="btn primary-btn" [disabled]="form.invalid || loading">
            <i class="bi bi-check-lg"></i>

            {{ isEditMode
            ? 'Salvar alterações'
            : 'Criar produto' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
